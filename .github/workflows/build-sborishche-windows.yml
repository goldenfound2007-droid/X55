name: Build SBORISHCHE Windows Update Center
on:
  push:
    branches:
      - sborishche-windows-update-center-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Windows source
        uses: actions/checkout@v4
      - name: Compile portable Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $compiler = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe" }
          if (-not (Test-Path $compiler)) { throw "Built-in .NET Framework C# compiler missing" }
          $src = (Resolve-Path "sborishche/windows-updater/SBORISHCHE_UPDATE_CENTER.cs").Path
          $out = Join-Path (Get-Location) "release/SBORISHCHE_UPDATE_CENTER.exe"
          & $compiler /nologo /codepage:65001 /target:winexe /platform:anycpu "/out:$out" /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll "$src"
          if ($LASTEXITCODE -ne 0) { throw "C# compilation failed" }
          if (-not (Test-Path release/SBORISHCHE_UPDATE_CENTER.exe)) { throw "Compiled EXE missing" }
          Get-Item release/SBORISHCHE_UPDATE_CENTER.exe | Select-Object Name,Length
          Copy-Item sborishche/windows-updater/SBORISHCHE_UPDATE_CENTER.cs release/SBORISHCHE_UPDATE_CENTER.cs
      - name: Windows launch smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path release/SBORISHCHE_UPDATE_CENTER.exe).Path -PassThru
          Start-Sleep -Seconds 2
          $p.Refresh()
          if ($p.HasExited) { throw "Updater exited immediately (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Upload tested portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: SBORISHCHE-WINDOWS-UPDATE-CENTER
          path: release/*
          if-no-files-found: error
          retention-days: 30
