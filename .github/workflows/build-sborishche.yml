name: Build SBORISHCHE Android APK
on:
  push:
    branches:
      - sborishche-android-v1-0-1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract Sborishche source project
        run: |
          mkdir -p work
          base64 -d sborishche/source.tar.gz.b64 | tar -xz -C work
          test -f work/SborishcheAndroidHost/app/build.gradle
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup
        uses: android-actions/setup-android@v3
      - name: Android platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9 setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: work/SborishcheAndroidHost
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK
        run: |
          test -s work/SborishcheAndroidHost/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp work/SborishcheAndroidHost/app/build/outputs/apk/debug/app-debug.apk release/SBORISHCHE_ANDROID_HOST_v1.0.1_debug.apk
          sha256sum release/*.apk
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SBORISHCHE-APK-v1.0.1
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
